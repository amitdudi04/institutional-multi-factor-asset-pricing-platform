[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "institutional-factor-platform"
version = "0.1.0"
description = "Governance and configuration foundation for an institutional quantitative research platform"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Repository Owner" }]
dependencies = [
  "duckdb>=1.3,<2",
  "exchange-calendars>=4.8,<5",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "pyarrow>=20,<22",
  "PyYAML>=6.0.2,<7",
  "yfinance>=0.2.65,<1",
]

[project.scripts]
institutional-factor-platform = "institutional_factor_platform.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.11,<1",
  "types-PyYAML>=6.0.12,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/institutional_factor_platform"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=institutional_factor_platform --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]

[tool.coverage.run]
branch = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["institutional_factor_platform"]

[[tool.mypy.overrides]]
module = ["duckdb.*", "exchange_calendars.*", "pandas.*", "pyarrow.*", "yfinance.*"]
ignore_missing_imports = true
follow_imports = "skip"
