schema_version: "1.0.0"
inputs:
  phase2_publication_id: factor-5a73616f131fca2102fa2ca4141ad64f
  phase3_publication_id: asset-pricing-c0a72fae5349f1048e18557250da1927
  phase4_publication_id: portfolio-dfef8d60d8a771e61224f0b314efd86c
features:
  families: [book_to_market, momentum_12_1m]
  value_column: score_value
  interactions: []
  minimum_coverage: 0.8
target:
  kind: future_excess_return
  horizon: 21
  benchmark_id: SPY
  threshold: null
  quantiles: 5
missing:
  policy: reject
  add_indicators: false
preprocessing:
  scaling: standard
  winsor_lower: null
  winsor_upper: null
split:
  method: walk_forward
  # Monthly decision periods: five years training, one year validation,
  # then one-month walk-forward tests and retraining.
  train_periods: 60
  validation_periods: 12
  test_periods: 1
  rolling_periods: null
  purge_overlaps: true
  embargo_periods: 1
  retrain_every: 1
models:
  enabled: [zero, historical_mean, factor_composite, linear, ridge, elastic_net, random_forest, xgboost]
  random_seed: 17
  thread_limit: 1
search:
  method: grid
  maximum_trials: 20
  selection_metric: spearman
  tie_break: simpler
  spaces:
    linear:
      fit_intercept: [true, false]
    ridge:
      alpha: [0.1, 1.0, 10.0]
    lasso:
      alpha: [0.0001, 0.001, 0.01]
    elastic_net:
      alpha: [0.0001, 0.001]
      l1_ratio: [0.25, 0.5, 0.75]
    logistic:
      C: [0.1, 1.0, 10.0]
    random_forest:
      n_estimators: [50, 100]
      max_depth: [3, 6]
    xgboost:
      n_estimators: [50, 100]
      max_depth: [2, 3]
      learning_rate: [0.05, 0.1]
calibration:
  method: none
  minimum_samples: 100
explainability:
  enabled: true
  sample_size: 500
  background_size: 100
  random_seed: 17
drift:
  psi_bins: 10
  warning_threshold: 0.2
economic_evaluation:
  enabled: true
  portfolio_method: equal_weight
  selection_quantile: 0.2
publication:
  output_root: data/ml
  manifest_root: data/ml_manifests
