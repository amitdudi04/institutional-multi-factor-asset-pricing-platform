schema_version: "1.0.0"
frequency: monthly
annualization_periods: 12
estimation_window: 36
minimum_observations: 12
covariance_method: ledoit_wolf
constraints:
  long_only: true
  leverage_limit: 1.0
  minimum_weight: 0.0
  maximum_weight: null
  turnover_limit: null
  transaction_cost_limit: null
  sector_limits: {}
  exposure_limits: {}
  liquidity_trade_limits: {}
costs:
  # Fixed before comparing the reported portfolio performance results.
  # Sensitivity totals are LOW/BASE/HIGH = 5/10/20 one-way bps.
  # Reported BASE decomposition: 5 bps spread + 2 bps slippage
  # + 3 bps fixed-impact allowance = 10 bps one way.
  # The engine charges half of spread_bps; the 2 bps slippage and
  # 3 bps fixed-impact allowance are bundled in slippage_bps.
  # Nonlinear market impact remains disabled.
  commission_bps: 0.0
  spread_bps: 10.0
  slippage_bps: 5.0
  market_impact_coefficient: 0.0
publication:
  output_root: data/portfolios
  manifest_root: data/portfolio_manifests
