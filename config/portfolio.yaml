schema_version: "1.0.0"
frequency: monthly
annualization_periods: 12
estimation_window: 36
minimum_observations: 12
covariance_method: ledoit_wolf
constraints:
  long_only: true
  leverage_limit: 1.0
  minimum_weight: 0.0
  maximum_weight: null
  turnover_limit: null
  transaction_cost_limit: null
  sector_limits: {}
  exposure_limits: {}
  liquidity_trade_limits: {}
costs:
  # Frozen before empirical Phase 4 performance inspection (Prompt 24).
  # Sensitivity totals are LOW/BASE/HIGH = 5/10/20 one-way bps.
  # The engine charges half of spread_bps. With no authenticated liquidity
  # input, the fixed 3 bps BASE impact allowance is conservatively bundled
  # with 2 bps slippage; nonlinear market impact remains disabled.
  commission_bps: 0.0
  spread_bps: 10.0
  slippage_bps: 5.0
  market_impact_coefficient: 0.0
publication:
  output_root: data/portfolios
  manifest_root: data/portfolio_manifests
