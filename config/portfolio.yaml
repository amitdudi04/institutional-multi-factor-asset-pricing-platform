schema_version: "1.0.0"
frequency: monthly
annualization_periods: 12
estimation_window: 36
minimum_observations: 12
covariance_method: ledoit_wolf
constraints:
  long_only: true
  leverage_limit: 1.0
  minimum_weight: 0.0
  maximum_weight: null
  turnover_limit: null
  transaction_cost_limit: null
  sector_limits: {}
  exposure_limits: {}
  liquidity_trade_limits: {}
costs:
  # Prespecified LOW/BASE/HIGH total costs: 5/10/20 bps per unit
  # of absolute traded weight (L1 = sum(abs(target - pretrade))).
  # One-way turnover = L1/2; it is NOT the fee multiplier in the engine.
  # BASE: 10 bps full quoted spread (5 bps half-spread per traded
  # weight unit) plus 5 bps in slippage_bps, comprising a modeled
  # 2 bps slippage and 3 bps fixed impact allowance.
  # Thus initial deployment at BASE costs 10 bps of NAV; a full
  # switch (sell weight 1 and buy weight 1, L1=2) costs 20 bps.
  # No empirical market-impact calibration or nonlinear impact is used.
  commission_bps: 0.0
  spread_bps: 10.0
  slippage_bps: 5.0
  market_impact_coefficient: 0.0
publication:
  output_root: data/portfolios
  manifest_root: data/portfolio_manifests
