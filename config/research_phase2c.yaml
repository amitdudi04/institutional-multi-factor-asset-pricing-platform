limited_sensitivity:
  id: dependent-constituent-excluded-legs-v1
  rule: exclude every dependent-portfolio constituent from each characteristic factor leg at signal formation; renormalize remaining positive original cap weights within the same original leg; never rerank
  missing_rule: missing or empty leg is unavailable; no synthetic return, cash or fallback
  sample: restrict to original primary dates and all-five-model complete cases; at least 24 observations and full rank in all models; refit unchanged baseline on identical retained dates/assets
  market: retain the authenticated SPY proxy; its underlying constituent exclusions cannot be verified with available inputs
  interpretation: predetermined diagnostic reducing direct characteristic-leg self-inclusion; not an independent external-factor study or replacement publication
  no_tuning: one specification only; report all exclusions and outcomes without choosing favorable rankings
multiplicity: Holm familywise adjustment within each model and across all 615 primary intercepts; valid under arbitrary test dependence conditional on valid marginal p-values; exploratory and does not repair HAC assumptions
